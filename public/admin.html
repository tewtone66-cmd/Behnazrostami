<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت | Behnazrostami</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="card admin"><div class="eyebrow">ADMIN PANEL</div><h1>مدیریت آموزشگاه</h1><p>کلید مدیریت را وارد کن؛ این نسخه برای راه‌اندازی اولیه است.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button onclick="stats()">اتصال</button><pre id="out"></pre><hr><h2>ساخت دوره</h2><input id="ct" placeholder="عنوان دوره"><input id="cd" placeholder="توضیحات"><button onclick="course()">ساخت دوره</button><h2>ساخت کاربر</h2><input id="un" placeholder="نام کاربری"><input id="pw" placeholder="رمز حداقل ۸ کاراکتر"><button onclick="user()">ساخت حساب</button></div></main><script>const $=x=>document.querySelector(x);async function call(url,method='GET',body){const o={method,headers:{'X-Admin-Key':$('#key').value}};if(body){o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}const r=await fetch(url,o);const d=await r.json();$('#out').textContent=JSON.stringify(d,null,2)}function stats(){call('/api/admin/stats')}function course(){call('/api/admin/course','POST',{title:$('#ct').value,description:$('#cd').value})}function user(){call('/api/admin/user','POST',{username:$('#un').value,password:$('#pw').value})}</script></body></html>
